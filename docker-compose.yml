# Backend + MySQL con un solo comando: docker-compose up -d
# Los valores por defecto son solo para desarrollo local; se pueden pisar con un archivo .env.
services:
  mysql:
    image: mysql:8.0
    container_name: stockiq-mysql
    environment:
      MYSQL_DATABASE: stockiq
      MYSQL_USER: stockiq
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stockiq}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    # utf8mb4 (RNF-06) y servidor en UTC, para que CURRENT_TIMESTAMP guarde UTC (RN-41)
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la primera inicialización MySQL levanta un servidor temporal
      # solo por socket, y un ping por socket daría "healthy" antes de que acepte conexiones de red.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    container_name: stockiq-backend
    # Si arranca antes de que la base esté lista, reintenta solo en lugar de quedar caído.
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/stockiq?connectionTimeZone=UTC&useUnicode=true&characterEncoding=utf8
      DB_USERNAME: stockiq
      DB_PASSWORD: ${MYSQL_PASSWORD:-stockiq}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-no-usar-en-produccion-123456}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
