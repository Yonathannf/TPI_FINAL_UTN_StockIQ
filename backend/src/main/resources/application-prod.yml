# Producción (Render + MySQL en Railway). Todo llega por variables de entorno y
# no hay valores por defecto a propósito: si falta alguna, el backend no arranca.
#
# DB_URL debe estar en formato JDBC, por ejemplo:
#   jdbc:mysql://<host>:<puerto>/<base>?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

stockiq:
  cors:
    # Dominio(s) del frontend en Vercel, separados por coma
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    # ENCARGADO inicial. ADMIN_PASSWORD es obligatoria solo en el primer arranque (tabla usuario vacía).
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    com.stockiq: INFO
