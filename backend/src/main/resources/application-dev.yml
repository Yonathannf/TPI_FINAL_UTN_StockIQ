# Desarrollo local: MySQL real.
# Los valores por defecto coinciden con los de docker-compose.yml, así que corre igual
# desde el IDE (con `docker-compose up -d mysql`) o dentro del contenedor.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stockiq?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:stockiq}
    password: ${DB_PASSWORD:stockiq}

stockiq:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    # ENCARGADO inicial (solo se crea si no hay usuarios). Solo para desarrollo.
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin1234}
  jwt:
    # Solo para desarrollo. Tiene que tener al menos 32 caracteres (HS256).
    secret: ${JWT_SECRET:dev-only-secret-no-usar-en-produccion-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    com.stockiq: DEBUG
